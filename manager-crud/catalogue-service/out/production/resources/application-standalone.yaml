server:
  port: 8081

spring:
  security:
    user:
      name: catalogue_service_user
      password: password
      roles:
        - ADMIN
  datasource:
    url: jdbc:postgresql://localhost:5432/manager_app_db
    username: admin
    password: admin
  flyway:
    schemas:
      - public
      - manager_app_db
  jpa:
    show-sql: true

logging:
  level:
    sql: info
