<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новый товар &ndash; ivdev</title>
    <link rel="stylesheet" data-th-href="@{/styles/app.css}" href="/styles/app.css">
</head>
<body>
<main class="app-shell">
    <header class="topbar">
        <a class="brand" data-th-href="@{/catalogue/products/list}">
            <span class="brand-mark">iv</span>
            <span>ivdev manager</span>
        </a>
        <nav class="nav-actions">
            <a class="button secondary" data-th-href="@{/catalogue/products/list}">&larr; К списку</a>
        </nav>
    </header>

    <section class="page-header">
        <div>
            <p class="eyebrow">Новая карточка</p>
            <h1>Новый товар</h1>
            <p class="lead">Заполните название и описание. После создания товар появится в общем каталоге.</p>
        </div>
    </section>

    <section class="panel form-card">
        <div class="alert" data-th-if="${errors}">
            <h2>Допущены ошибки</h2>
            <ul>
                <li data-th-each="error: ${errors}" data-th-text="${error}"></li>
            </ul>
        </div>
        <form class="form-grid" method="post" data-th-action="@{/catalogue/products/create}">
            <label class="field">
                <span>Название</span>
                <input type="text" name="title" data-th-value="${payload?.title}" placeholder="Например, Молоток">
            </label>
            <label class="field">
                <span>Количество</span>
                <input type="number" name="quantity" data-th-value="${payload?.quantity}" placeholder="Например, 2">
            </label>
            <label class="field">
                <span>Описание</span>
                <textarea name="details" data-th-text="${payload?.details}" placeholder="Например, я МОП"></textarea>
            </label>
            <div class="button-row">
                <button class="button" type="submit">Создать товар</button>
                <a class="button secondary" data-th-href="@{/catalogue/products/list}">Отмена</a>
            </div>
        </form>
    </section>
</main>
</body>
</html>
