services:
  postgres:
    image: postgres:16-alpine
    container_name: manager_app_db
    environment:
      POSTGRES_DB: "manager_app_db"
      POSTGRES_USER: "admin"
      POSTGRES_PASSWORD: "admin"
      PGDATA: "/var/lib/postgresql/data/pgdata"
    volumes:
      - ./init-scripts:/docker-entrypoint-initdb.d
      - manager_app_db:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    cpus: '1'
    mem_limit: 4g

volumes:
  manager_app_db: